<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Praktik Form</title>
</head>
<body>
    <header>
        <h1>Form Pendaftaran & Input</h1>
    </header>
    <nav>
        <a href="index.html">Kembali ke Beranda</a>
    </nav>
    <main>
        <section>
            <form>
                <label for="nama">Nama:</label><br>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="nama@email.com" required><br><br>

                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required><br><br>

                <label for="prodi">Program Studi:</label><br>
                <select id="prodi" name="prodi">
                    <option value="rpl">Rekayasa Perangkat Lunak</option>
                    <option value="ti">Teknik Informatika</option>
                </select><br><br>

                <button type="submit">Kirim</button>
                <button type="reset">Reset</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Aqila Ulin Nuha</p>
    </footer>
</body>
</html>
