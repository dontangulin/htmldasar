<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Praktik Table</title>
</head>
<body>
    <header>
        <h1>Penggunaan Tabel HTML</h1>
    </header>
    <nav>
        <a href="index.html">Kembali ke Beranda</a>
    </nav>
    <main>
        <section>
            <h2>Tabel dengan Colspan dan Rowspan</h2>
            <table border="1">
                <tr><th colspan="3">Jadwal Kuliah RPL A</th></tr>
                <tr><th>Hari</th><th>Jam</th><th>Mata Kuliah</th></tr>
                <tr><td rowspan="2">Senin</td><td>08.00</td><td>Aljabar Linier</td></tr>
                <tr><td>10.00</td><td>Pemrograman Web</td></tr>
            </table>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Aqila Ulin Nuha</p>
    </footer>
</body>
</html>
